name: CI
on:
  push:
    branches: [ main ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - name: Install test dependencies
        run: uv pip install --system -e .[all]
      - name: Test
        env:
          SHELL: /bin/bash  # Required by test_proc.py::test_pipeline_shell_executable_warning
        run: |
          git config --global user.name ci
          git config --global user.email ci
          pytest -v -m 'not live'
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.13'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv pip install --system build twine
          # `--sdist --wheel` builds both from the source tree; default (wheel-via-sdist) fails
          # because `utz.setup` shells out to git, and the unpacked sdist isn't a git repo
          python -m build --sdist --wheel
          twine upload dist/*
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
